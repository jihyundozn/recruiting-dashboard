function atsChannelInfo(raw){

function atsISO(s){

function atsKoreanDate(s){

function atsOperatingDays(p,asOf){

function atsCalendarDays(then,nowValue=Date.now()){

function atsSheetRows(xml,strings){
 const doc=new DOMParser().parseFromString(xml,'application/xml'),result=[];
 if(doc.getElementsByTagName('parsererror').length)throw Error('시트 XML을 읽지 못했습니다.');

  const cols=[];
  for(const c of row.getElementsByTagNameNS('*','c')){
   const id=(c.getAttribute('r')||'A').match(/^[A-Z]+/)[0];let index=0;
   for(const letter of id)index=index*26+letter.charCodeAt(0)-64;index--;

  }

async function atsReadWorkbook(file){

 const shared=ss?[...parser.parseFromString(ss,'application/xml').getElementsByTagNameNS('*','si')].map(si=>[...si.getElementsByTagNameNS('*','t')].map(t=>t.textContent).join('')):[];

 for(const s of names){
  const name=s.getAttribute('name'),target=relationships[s.getAttribute('r:id')]||'';
  const path='xl/'+target.replace(/^\//,'').replace(/^xl\//,'').replace(/^\.\//,'');

async function atsCloudFetch(table){
 const all=[];for(let start=0;;start+=1000){
  const query=cloudClient.from(table).select('*');
  if(table==='ats_applications')query.order('posting_id',{ascending:true}).order('applicant_id',{ascending:true});
  else query.order(table==='ats_postings'?'posting_id':'event_key',{ascending:true});
  const {data:rows,error}=await query.range(start,start+999);
  if(error)throw error;all.push(...(rows||[]));if(!rows||rows.length<1000)break;
  if(start>=100000)throw Error('ATS 조회 행수가 너무 많습니다.');
 }return all;
}
async function loadATS(){

   const [p,a,e,meta]=await Promise.all([atsCloudFetch('ats_postings'),atsCloudFetch('ats_applications'),atsCloudFetch('ats_stage_events'),cloudClient.from('ats_import_meta').select('as_of,uploaded_at').eq('user_id',cloudUser.id).maybeSingle()]);
   if(meta.error)throw meta.error;

async function atsParseMasterFile(file){

  if(!m)throw Error("'공고 마스터' 시트를 찾지 못했습니다. 기존 설계안을 업로드하거나 CSV 템플릿을 이용하세요.");

 }else if(file.name.toLowerCase().endsWith('.csv')){
  let t=new TextDecoder('utf-8').decode(await file.arrayBuffer());if(t.includes('\ufffd'))t=new TextDecoder('euc-kr').decode(await file.arrayBuffer());
  rows=rowsToObjects(parseCSV(t));

  const posting_id=get(r,'공고 ID','공고ID');if(!posting_id)continue;

  if(duplicate.has(posting_id)){skipped.push(`중복 공고 ID ${posting_id}`);continue}duplicate.add(posting_id);
  const opened_on=get(r,'오픈일 (입력)','오픈일'),closed_on=get(r,'클로징일 (입력)','클로징일');
  const operating_status=get(r,'운영 상태 (입력)','운영 상태');
  const target=get(r,'채용 목표(명)','채용 목표 인원'),minimum=get(r,'최소 면접 진행 인원','면접 풀 최소(명)','면접풀 기준');
  const owner=get(r,'채용 담당자','담당자'),notes=get(r,'비고','운영 메모');
  const cleanDate=(v)=>{if(!v)return null;if(/^\d{5}(\.\d+)?$/.test(v))return atsISO(Number(v))?.slice(0,10)||null;return /^\d{4}-\d{2}-\d{2}$/.test(v)?v:null};
  const start=cleanDate(opened_on),end=cleanDate(closed_on);
  if((opened_on&&!start)||(closed_on&&!end)){skipped.push(`날짜 형식 오류 · ${posting_id}`);continue}
  if(start&&end&&start>end){skipped.push(`마감일이 오픈일보다 빠름 · ${posting_id}`);continue}
  if(operating_status&&!['미확인','진행중','마감','보류'].includes(operating_status)){skipped.push(`알 수 없는 운영 상태 · ${posting_id}`);continue}
  if((target&&!/^\d+$/.test(target))||(minimum&&!/^\d+$/.test(minimum))){skipped.push(`목표 인원 형식 오류 · ${posting_id}`);continue}

    target_hires:target?Number(target):null,min_interview_pool:minimum?Number(minimum):null,owner_name:owner||null,notes:notes||null});
 }

function atsModel(){

 for(const e of ats.events){const k=atsKey(e);let arr=eventByApplication.get(k);if(!arr)eventByApplication.set(k,arr=[]);arr.push(e)}
 const groups=[];let total=0,active=0,accepted=0,waiting=0,estimated=0,unresolved=0;
 const nowValue=ats.asOf?new Date(ats.asOf).getTime():Date.now();
 for(const p of ats.postings){
  const arr=applicationByPosting.get(p.posting_id)||[],stat={...p,total:arr.length,active:0,accepted:0,interviewActive:0,waiting:0,waitingEstimated:0,waitingUnknown:0,firstApplied:null,lastApplied:null,
   reached:{'과제':0,'검사':0,'1차 인터뷰':0,'2차 인터뷰':0,'기타 면접':0,'오퍼':0,'면접 전체':0},channels:{},stageNow:{},daysToATSOffer:[],directToSecond:0,bothInterviews:0};

   if(a.applied_at){
    if(!stat.firstApplied||a.applied_at<stat.firstApplied)stat.firstApplied=a.applied_at;
    if(!stat.lastApplied||a.applied_at>stat.lastApplied)stat.lastApplied=a.applied_at;
   }
   const state=a.current_status,sg=atsStage(a.current_stage),events=(eventByApplication.get(atsKey(a))||[]);
   const reached=new Set([sg]);for(const e of events){reached.add(atsStage(e.from_stage));reached.add(atsStage(e.to_stage))}
   for(const name of ['과제','검사','1차 인터뷰','2차 인터뷰','기타 면접','오퍼'])if(reached.has(name))stat.reached[name]++;
   const it=[...reached].some(x=>ATS_INTERVIEW_GROUPS.has(x));if(it)stat.reached['면접 전체']++;
   if(reached.has('1차 인터뷰')&&reached.has('2차 인터뷰'))stat.bothInterviews++;
   if(reached.has('2차 인터뷰')&&!reached.has('1차 인터뷰'))stat.directToSecond++;
   const channel=atsChannel(a.source_raw),ch=stat.channels[channel]||(stat.channels[channel]={all:0,interview:0,accepted:0});ch.all++;if(it)ch.interview++;if(state==='합격')ch.accepted++;

 let start='',end=asOf,label='최근 12개월';
 if(atsReport.mode==='last12'){start=anMonthBase(asOf.slice(0,7),-11)+'-01';}
 else if(atsReport.mode==='all'){start='';end='9999-12-31';label='전체 기간';}

function anMappingImpact(r){

<script>

 data.updatedAt=now();

 if(cloudError||cloudConflict){b.innerHTML=`<div class="note o"><b>클라우드 저장 주의:</b> ${esc(cloudError||'동기화 오류')}<div class="row" style="margin-top:8px"><button class="btn s sm" id="cloudExport">현재 화면 데이터 JSON 백업</button><button class="btn s sm" id="cloudReload">서버에서 다시 불러오기</button>${!cloudConflict?'<button class="btn s sm" id="cloudRetry">저장 재시도</button>':''}</div></div>`;
  b.querySelector('#cloudExport').onclick=()=>download('동기화실패_백업.json',JSON.stringify(data,null,2),'application/json');

  if(b.querySelector('#cloudRetry'))b.querySelector('#cloudRetry').onclick=()=>{cloudError='';void flushCloud()};

async function flushCloud(){
 if(!cloudEnabled||!cloudReady||!cloudUser||cloudSaving||cloudConflict||!cloudDirty)return;
 cloudSaving=true;cloudStatus='동기화 중';syncUI();
 while(cloudDirty&&!cloudConflict){
  cloudDirty=false;
  // Snapshot and revision prevent overwriting data changed in another browser session.
  const payload=JSON.parse(JSON.stringify(data));
  try{
   const {data:newRevision,error}=await cloudClient.rpc('write_recruit_dashboard',{p_payload:payload,p_expected_revision:cloudRevision});
   if(error)throw error;
   if(newRevision==null){cloudConflict=true;cloudDirty=true;cloudError='다른 기기에서 데이터가 변경됐습니다. 현재 내용을 JSON으로 백업하고 서버 데이터를 새로 불러오세요.';break}
   cloudRevision=Number(newRevision);
  }catch(e){cloudDirty=true;cloudError=`네트워크 또는 권한 오류: ${e.message||String(e)}`;break}

}

  try{const {data:result,error}=await cloudClient.auth.signInWithPassword({email:document.querySelector('#loginEmail').value.trim(),password:document.querySelector('#loginPassword').value});if(error)throw error;cloudUser=result.user;cloudError='';await loadCloudData()}

async function loadCloudData(){

 try{
  const {data:row,error}=await cloudClient.from('recruit_dashboard_state').select('payload,revision').eq('user_id',cloudUser.id).maybeSingle();
  if(error)throw error;
  data=normalizeData(row?.payload);cloudRevision=Number(row?.revision||0);cloudReady=true;cloudStatus='불러오기 완료';

async function initCloud(){

 if(!window.supabase?.createClient){cloudError='Supabase 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.';cloudGate();return}

const STOP=new Set('또는 그리고 또한 가능한 있는지 경험 역량 경력 이상 이하 보유 우대 가능 있는 관련 대한 기반 활용 업무 직무 능력 이해 필요 필수 수준 수행 관리 운영 개발 모집 지원 자격 주요 고객사 활동 담당 성과 필수요건 우대사항 자격요건 경험자 분 함께 내외부 커뮤니케이션 및 와 과 을 를 은 는 의 에 를 하는 하는분 할 수 있는 분 에서 통해 위한 것 경우'.split(' '));
function lines(s){return String(s||'').split(/\r?\n|[•●]/).map(x=>x.trim().replace(/^[-*\d.)\s]+/,'').trim()).filter(Boolean).slice(0,30)}
function JDrequirements(j){
 let must=lines(j.must),pref=lines(j.preferred);
 if(!must.length){const body=String(j.body||'').split(/\r?\n/);let mode='';for(const row of body){const v=row.trim();if(/^(자격\s*요건|지원\s*자격|필수\s*요건|required|qualifications)/i.test(v)){mode='must';continue}if(/^(우대\s*사항|우대\s*요건|preferred)/i.test(v)){mode='pref';continue}if(/^(주요\s*업무|담당\s*업무|responsibilities)/i.test(v)){mode='work';continue}if(/^[-•●\d.\s]/.test(row)&&v.length>4&&v.length<160){if(mode==='must')must.push(v.replace(/^[-•●\d.)\s]+/,''));else if(mode==='pref'&&!j.preferred)pref.push(v.replace(/^[-•●\d.)\s]+/,''));}}}
 if(!must.length)must=lines(j.body).filter(s=>s.length>=4&&!/^(자격|우대|주요)/.test(s)).slice(0,8);
 return {must:must.slice(0,15),pref:pref.slice(0,10)};
}
function tokens(s){return (String(s||'').toLowerCase().match(/[a-z][a-z0-9+#.\/-]{1,}|[가-힣]{2,}|\d+년/g)||[]).filter(t=>t.length>=2&&!STOP.has(t)&&!/^(하시는|하셨|하였|경험이|경험을|업무를|역량을|보유자)$/.test(t)).slice(0,25)}
function checkTerm(term,resume){
 const txt=resume.toLowerCase().replace(/\s+/g,' '),q=term.toLowerCase().replace(/\s+/g,' ');
 if(txt.includes(q))return {status:'확인됨',ratio:1,matched:[term]};
 const ts=[...new Set(tokens(term))];if(!ts.length)return {status:'확인 필요',ratio:0,matched:[]};
 const matched=ts.filter(t=>txt.includes(t));let ratio=matched.length/ts.length;
 // 경력 연수 조건이 쓰여 있으면, 해당 기간이 확인되지 않은 상태에서 완전 충족으로 표시하지 않는다.
 const yrs=term.match(/(\d+)\s*년\s*(이상|\+|이상의)/);if(yrs&&!new RegExp(`${yrs[1]}\\s*년`).test(resume))ratio=Math.min(ratio,.65);
 return {status:ratio>=.78?'단어 일치':ratio>0?'일부 일치':'확인 필요',ratio,matched};
}
function quickScreen(j,resume){

 const avg=a=>a.length?a.reduce((sum,c)=>sum+c.ratio,0)/a.length:0;
 const ma=checks.filter(x=>x.kind==='필수'),pa=checks.filter(x=>x.kind==='우대');

 if(ma.some(c=>c.ratio===0))score=Math.min(score,79); // 명시된 필수요건 미확인 시 자동 연락 대상 등록 방지
 const good=checks.filter(c=>c.ratio>=.78),unknown=checks.filter(c=>c.ratio<.78);

 if($('#cloudConnect'))$('#cloudConnect').onclick=()=>{const url=$('#sbUrl').value.trim(),key=$('#sbKey').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(url)||!(key.startsWith('sb_publishable_')||key.startsWith('eyJ'))){alert('Supabase Project URL과 Publishable key를 확인해 주세요.');return}if(!confirm('기존 로컬 데이터는 자동 업로드되지 않습니다. JSON 백업을 내려받았나요?'))return;localStorage.setItem(CLOUD_SETTINGS_KEY,JSON.stringify({url:url.replace(/\/$/,''),publishableKey:key}));location.reload()};
 if($('#cloudSignOut'))$('#cloudSignOut').onclick=async()=>{if(cloudSaving||cloudDirty){alert('동기화가 끝나거나 JSON 백업 후 로그아웃하세요.');return}await cloudClient.auth.signOut();cloudUser=null;cloudReady=false;data=empty();cloudGate()};
 if($('#cloudDetach'))$('#cloudDetach').onclick=()=>{if(envCfg.url&&envCfg.publishableKey){alert('배포용 config.js에 연결값이 있습니다. 연결 해제하려면 config.js를 수정해야 합니다.');return}if(confirm('이 기기에서 클라우드 설정을 해제할까요? 서버 데이터는 삭제되지 않습니다.')){localStorage.removeItem(CLOUD_SETTINGS_KEY);location.reload()}};
 $('#view').insertAdjacentHTML('afterbegin',`<div class="card"><h2>ATS 데이터 백업</h2><p class="mute">ATS 원본의 필요한 열만 추출한 데이터는 별도 저장소에 있습니다. 기존 JSON 백업에는 ATS 데이터가 포함되지 않지만 채널 매핑 수정사항은 대시보드 백업에 포함됩니다.</p><p><button class="btn s" id="atsBackup">ATS 데이터 JSON 백업</button></p><p class="mute">원본 엑셀로 다시 복원 가능하며, 이 백업 파일에는 지원자 ID 등 연결 가능한 개인정보가 포함될 수 있습니다.</p></div>`);
 $('#atsBackup').onclick=()=>download('ATS데이터_백업_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({postings:ats.postings,applications:ats.applications,events:ats.events},null,2),'application/json;charset=utf-8');
 $('#backup').onclick=()=>download('채용대시보드_백업_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(data,null,2),'application/json;charset=utf-8');
 $('#restore').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const d=JSON.parse(await file.text());if(!d||!Array.isArray(d.jds)||!Array.isArray(d.candidates)||!Array.isArray(d.assessments))throw Error('대시보드 백업 파일이 아니에요.');if(confirm('현재 데이터를 모두 교체하고 백업 파일을 복원할까요?'))commit(()=>{data={...empty(),...d}})}catch(e){alert(e.message)}};
 $('#wipe').onclick=()=>{if(confirm('모든 JD, 분석 이력, 소싱 기록이 삭제됩니다(ATS 데이터는 유지). 먼저 백업했나요?')&&confirm('정말 전부 삭제할까요?'))commit(()=>{data=empty();editingJd=null;staged=null})};
 $$('[data-delass]').forEach(b=>b.onclick=()=>{if(confirm('이 분석 이력을 삭제할까요? 소싱 목록은 유지됩니다.'))commit(()=>{data.assessments=data.assessments.filter(a=>a.id!==b.dataset.delass)})});
}
async function copyText(s,button){
 try{if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(s);else throw Error('not supported');if(button)button.textContent='복사됨';}
 catch(e){const t=document.createElement('textarea');t.value=s;t.style.position='fixed';t.style.left='-9999px';document.body.append(t);t.select();try{document.execCommand('copy');if(button)button.textContent='복사됨';}catch{alert('자동 복사가 제한되었습니다. Chrome 또는 Edge에서 열어 주세요.')}t.remove();}
}
if(!cloudEnabled)atsLoadLocal();
render();
if(cloudEnabled)void initCloud();
if(notice&&!cloudEnabled)alert(notice);

</script>
</body>
</html>

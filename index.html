<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>채용 대시보드</title>
  <style>
    :root {
      --bg: #f6f9fc;
      --card: #ffffff;
      --line: #d8e2ec;
      --text: #10263f;
      --muted: #63778d;
      --soft: #eef4f8;
      --dark: #123b6b;
      --mid: #2F5D8A;
      --amber-bg: #fff8e8;
      --amber-line: #f4d98b;
      --rose-bg: #fff3f4;
      --rose-line: #f7c7ce;
      --emerald-bg: #eefbf7;
      --emerald-line: #b6ead8;
      --radius: 24px;
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .header {
      padding: 28px;
      display: flex;
      gap: 16px;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .eyebrow {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 6px;
    }
    h1 {
      margin: 0;
      font-size: 36px;
      line-height: 1.1;
    }
    .sub {
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
    }
    .header-meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(160px, 1fr));
      gap: 12px;
      min-width: min(100%, 420px);
    }
    .pillbox {
      border: 1px solid var(--line);
      background: var(--soft);
      border-radius: 18px;
      padding: 12px 14px;
      font-size: 14px;
      color: var(--mid);
    }
    .section { margin-top: 22px; }
    .kpis {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }
    .kpi {
      padding: 20px;
    }
    .kpi .label {
      font-size: 14px;
      color: var(--muted);
      font-weight: 600;
    }
    .kpi .row {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
    }
    .kpi .value {
      font-size: 34px;
      font-weight: 800;
      line-height: 1;
    }
    .live {
      background: var(--soft);
      color: var(--mid);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
    }
    .kpi .note {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
    }
    .grid-12 {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 16px;
    }
    .panel { padding: 24px; }
    .span-5 { grid-column: span 5; }
    .span-4 { grid-column: span 4; }
    .span-3 { grid-column: span 3; }
    .span-6 { grid-column: span 6; }
    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 18px;
    }
    .title-row h2 {
      margin: 0;
      font-size: 20px;
    }
    .title-row p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
    .mini-tag {
      background: var(--soft);
      color: var(--mid);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      white-space: nowrap;
    }
    .bar-item { margin-bottom: 14px; }
    .bar-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
      font-size: 14px;
    }
    .bar-track {
      height: 12px;
      background: var(--soft);
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: var(--mid);
      border-radius: 999px;
    }
    .bar-fill.mid { background: var(--mid); }
    .alerts { display: grid; gap: 12px; }
    .alert {
      border-radius: 18px;
      padding: 16px;
      border: 1px solid transparent;
    }
    .alert strong { display: block; font-size: 15px; }
    .alert span { display: block; margin-top: 4px; font-size: 13px; opacity: .9; }
    .amber { background: var(--amber-bg); border-color: var(--amber-line); }
    .rose { background: var(--rose-bg); border-color: var(--rose-line); }
    .emerald { background: var(--emerald-bg); border-color: var(--emerald-line); }
    .monthly {
      height: 256px;
      background: var(--soft);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }
    .month-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      height: 100%;
    }
    .month-bar {
      width: 100%;
      background: var(--mid);
      border-radius: 16px 16px 0 0;
      min-height: 4px;
    }
    .month-label {
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
    }
    .table-wrap {
      overflow: auto;
      border-radius: 18px;
      border: 1px solid var(--line);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      min-width: 920px;
    }
    th, td {
      padding: 14px 16px;
      text-align: left;
      border-top: 1px solid #eef4f8;
    }
    thead th {
      background: #f6f9fc;
      color: var(--muted);
      font-weight: 600;
      border-top: none;
    }
    .status-pill {
      background: var(--soft);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      display: inline-block;
    }
    .helper-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .helper {
      background: var(--soft);
      border-radius: 18px;
      padding: 16px;
      font-size: 14px;
      color: var(--mid);
      line-height: 1.6;
    }
    .helper strong {
      color: var(--text);
      display: block;
      margin-bottom: 6px;
    }
    .codebox {
      margin-top: 16px;
      background: #123b6b;
      color: #e2e8f0;
      padding: 16px;
      border-radius: 18px;
      font-size: 12px;
      word-break: break-all;
    }
    .footer-note {
      margin-top: 14px;
      font-size: 13px;
      color: var(--muted);
    }
    @media (max-width: 1100px) {
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .span-5, .span-4, .span-3, .span-6 { grid-column: span 12; }
    }
    @media (max-width: 640px) {
      .wrap { padding: 16px; }
      .header { padding: 20px; }
      h1 { font-size: 28px; }
      .header-meta, .helper-grid, .kpis { grid-template-columns: 1fr; }
      .panel { padding: 18px; }
      .kpi .value { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="card header">
      <div>
        <div class="eyebrow">Recruiting Dashboard</div>
        <h1>채용 대시보드</h1>
        
      </div>
      <div class="header-meta" id="headerMeta"></div>
    </section>

    <section class="section kpis" id="kpis"></section>

    <section class="section grid-12">
      <div class="card panel span-5">
        <div class="title-row">
          <div>
            <h2>단계별 파이프라인</h2>
            
          </div>
          <div class="mini-tag">Pipeline</div>
        </div>
        <div id="pipeline"></div>
      </div>

      <div class="card panel span-4">
        <div class="title-row">
          <div>
            <h2>지원경로별 현황</h2>
            
          </div>
        </div>
        <div id="sourceData"></div>
      </div>

      <div class="card panel span-3">
        <div class="title-row">
          <div>
            <h2>알림</h2>
            
          </div>
        </div>
        <div class="alerts" id="alerts"></div>
      </div>
    </section>

    <section class="section grid-12">
      <div class="card panel span-6">
        <div class="title-row">
          <div>
            <h2>포지션별 지원자 수</h2>
            
          </div>
        </div>
        <div id="positionData"></div>
      </div>

      <div class="card panel span-6">
        <div class="title-row">
          <div>
            <h2>월별 지원 추이</h2>
            
          </div>
          <div class="mini-tag">최근 12개월</div>
        </div>
        <div class="monthly" id="monthly"></div>
      </div>
    </section>

    <section class="section card panel">
      <div class="title-row">
        <div>
          <h2>포지션별 상세 현황</h2>
          
        </div>
        <div class="mini-tag">ApplicantDB 자동 집계</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>포지션</th>
              <th>조직</th>
              <th>담당자</th>
              <th>현재상태</th>
              <th>지원자</th>
              <th>면접</th>
              <th>오퍼</th>
              <th>입사</th>
              <th>평균 소요일</th>
            </tr>
          </thead>
          <tbody id="summaryTable"></tbody>
        </table>
      </div>
    </section>

  </div>

  <script>
    const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSD1j1eZSIykfVWrH3DItFuKwFRbQdb_FBcb83gre5wkqg-oDT8k3qtiDTQa2Q9pWGD7vi74Qw7b-Ql/pub?gid=1605953041&single=true&output=csv';

    const fallbackApplicants = [
      { candidate_id:'CAND-001', applied_date:'2026-01-03', candidate_name:'김도윤', position:'백엔드 개발자', department:'플랫폼개발팀', hiring_manager:'김민지', source:'채용홈페이지', current_stage:'1차면접', final_status:'진행중', offer_date:'', join_date:'', rejection_date:'', lead_time_days:'18', note:'' },
      { candidate_id:'CAND-002', applied_date:'2026-01-05', candidate_name:'이수민', position:'프론트엔드 개발자', department:'플랫폼개발팀', hiring_manager:'박지훈', source:'원티드', current_stage:'2차면접', final_status:'진행중', offer_date:'', join_date:'', rejection_date:'', lead_time_days:'21', note:'' },
      { candidate_id:'CAND-003', applied_date:'2026-01-09', candidate_name:'정하은', position:'PM', department:'서비스기획팀', hiring_manager:'이서연', source:'추천', current_stage:'오퍼', final_status:'오퍼', offer_date:'2026-02-03', join_date:'', rejection_date:'', lead_time_days:'25', note:'' },
      { candidate_id:'CAND-004', applied_date:'2026-01-12', candidate_name:'최민준', position:'프로덕트 디자이너', department:'디자인팀', hiring_manager:'정현우', source:'링크드인', current_stage:'서류검토', final_status:'진행중', offer_date:'', join_date:'', rejection_date:'', lead_time_days:'9', note:'' },
      { candidate_id:'CAND-005', applied_date:'2026-01-14', candidate_name:'장서윤', position:'데이터 분석가', department:'데이터팀', hiring_manager:'김민지', source:'에이전시', current_stage:'최종면접', final_status:'진행중', offer_date:'', join_date:'', rejection_date:'', lead_time_days:'17', note:'' },
      { candidate_id:'CAND-006', applied_date:'2026-01-15', candidate_name:'박준영', position:'백엔드 개발자', department:'플랫폼개발팀', hiring_manager:'김민지', source:'채용홈페이지', current_stage:'입사완료', final_status:'입사완료', offer_date:'2026-02-02', join_date:'2026-02-24', rejection_date:'', lead_time_days:'40', note:'' },
      { candidate_id:'CAND-007', applied_date:'2026-01-18', candidate_name:'서지후', position:'PM', department:'서비스기획팀', hiring_manager:'이서연', source:'추천', current_stage:'불합격', final_status:'불합격', offer_date:'', join_date:'', rejection_date:'2026-02-01', lead_time_days:'14', note:'' },
      { candidate_id:'CAND-008', applied_date:'2026-02-01', candidate_name:'김하린', position:'프론트엔드 개발자', department:'플랫폼개발팀', hiring_manager:'박지훈', source:'원티드', current_stage:'오퍼', final_status:'오퍼', offer_date:'2026-03-02', join_date:'', rejection_date:'', lead_time_days:'30', note:'' },
      { candidate_id:'CAND-009', applied_date:'2026-02-10', candidate_name:'윤채원', position:'프로덕트 디자이너', department:'디자인팀', hiring_manager:'정현우', source:'직접지원', current_stage:'1차면접', final_status:'진행중', offer_date:'', join_date:'', rejection_date:'', lead_time_days:'12', note:'' },
      { candidate_id:'CAND-010', applied_date:'2026-02-14', candidate_name:'임예준', position:'데이터 분석가', department:'데이터팀', hiring_manager:'김민지', source:'리멤버', current_stage:'서류검토', final_status:'진행중', offer_date:'', join_date:'', rejection_date:'', lead_time_days:'6', note:'' }
    ];

    const stageOrder = ['서류접수', '서류검토', '1차면접', '2차면접', '과제', '최종면접', '처우협의', '오퍼', '입사대기', '입사완료', '불합격'];

    function parseCsv(text) {
      const rows = [];
      let current = '';
      let row = [];
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];
        if (char === '"') {
          if (inQuotes && next === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          row.push(current);
          current = '';
        } else if ((char === '\n' || char === '\r') && !inQuotes) {
          if (char === '\r' && next === '\n') i++;
          row.push(current);
          if (row.some(cell => cell !== '')) rows.push(row);
          row = [];
          current = '';
        } else {
          current += char;
        }
      }
      if (current.length || row.length) {
        row.push(current);
        rows.push(row);
      }
      if (!rows.length) return [];
      const headers = rows[0].map(h => h.trim());
      return rows.slice(1).map(values => {
        const item = {};
        headers.forEach((header, idx) => item[header] = (values[idx] || '').trim());
        return item;
      });
    }

    function groupCount(data, key) {
      const map = new Map();
      data.forEach(item => {
        const value = item[key] || '미분류';
        map.set(value, (map.get(value) || 0) + 1);
      });
      return [...map.entries()].map(([name, value]) => ({ name, value }));
    }

    function average(numbers) {
      if (!numbers.length) return '-';
      return Math.round(numbers.reduce((a,b) => a+b, 0) / numbers.length) + '일';
    }

    function formatDate(dateString) {
      if (!dateString) return '-';
      const d = new Date(dateString);
      if (Number.isNaN(d.getTime())) return dateString;
      return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
    }

    function barListHtml(items, max, mid=false, suffix='') {
      return items.map(item => `
        <div class="bar-item">
          <div class="bar-head"><span>${item.name || item.stage}</span><span>${item.value ?? item.count}${suffix}</span></div>
          <div class="bar-track"><div class="bar-fill ${mid ? 'mid' : ''}" style="width:${((item.value ?? item.count) / max) * 100}%"></div></div>
        </div>
      `).join('');
    }

    async function getApplicants() {
      try {
        const response = await fetch(GOOGLE_SHEET_CSV_URL);
        if (!response.ok) throw new Error('fetch failed');
        const text = await response.text();
        const parsed = parseCsv(text);
        if (!parsed.length) throw new Error('empty');
        return { data: parsed, source: '데이터 연동 완료' };
      } catch (e) {
        return { data: fallbackApplicants, source: '연결 확인 필요' };
      }
    }

    function render(applicants, sourceLabel) {
      const totalApplicants = applicants.length;
      const inInterview = applicants.filter(item => ['1차면접','2차면접','과제','최종면접'].includes(item.current_stage)).length;
      const offerCount = applicants.filter(item => item.final_status === '오퍼' || item.current_stage === '오퍼').length;
      const joinedCount = applicants.filter(item => item.final_status === '입사완료').length;
      const rejectedCount = applicants.filter(item => item.final_status === '불합격').length;
      const openPositions = new Set(applicants.filter(item => !['입사완료','불합격'].includes(item.final_status)).map(item => item.position)).size;
      const leadTimes = applicants.map(item => Number(item.lead_time_days)).filter(v => !Number.isNaN(v) && v > 0);
      const avgLeadTime = average(leadTimes);
      const offerToJoin = offerCount > 0 ? Math.round((joinedCount / offerCount) * 100) + '%' : '-';

      const kpis = [
        ['전체 지원자', totalApplicants],
        ['면접 진행', inInterview],
        ['오퍼', offerCount],
        ['입사완료', joinedCount],
        ['불합격', rejectedCount],
        ['오퍼→입사 전환율', offerToJoin],
        ['평균 채용소요일', avgLeadTime],
        ['오픈 포지션', openPositions]
      ];

      document.getElementById('kpis').innerHTML = kpis.map(([label, value]) => `
        <div class="card kpi">
          <div class="label">${label}</div>
          <div class="row">
            <div class="value">${value}</div>
            <div class="live">Live</div>
          </div>
        </div>
      `).join('');

      document.getElementById('headerMeta').innerHTML = [
        sourceLabel,
        `지원자 ${totalApplicants}명`,
        `포지션 ${openPositions}개`,
        `업데이트 ${new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })}`
      ].map(item => `<div class="pillbox">${item}</div>`).join('');

      const pipeline = stageOrder.map(stage => ({ stage, count: applicants.filter(item => item.current_stage === stage).length })).filter(item => item.count > 0);
      const maxPipeline = Math.max(1, ...pipeline.map(item => item.count));
      document.getElementById('pipeline').innerHTML = barListHtml(pipeline, maxPipeline, false, '명');

      const sourceData = groupCount(applicants, 'source').sort((a,b) => b.value - a.value);
      const maxSource = Math.max(1, ...sourceData.map(item => item.value));
      document.getElementById('sourceData').innerHTML = barListHtml(sourceData, maxSource, true, '');

      const longProgress = applicants.filter(item => Number(item.lead_time_days) >= 14 && item.final_status === '진행중').length;
      const scheduledJoin = applicants.filter(item => item.join_date).length;
      const alerts = [
        ['amber', `오퍼 후보자 ${offerCount}명`, '처우협의/오퍼 단계 점검 필요'],
        ['rose', `${longProgress}명 장기 진행`, '14일 이상 진행 중 후보자 확인'],
        ['emerald', `${scheduledJoin}명 입사 일정 보유`, '입사 예정자 및 완료자 확인']
      ];
      document.getElementById('alerts').innerHTML = alerts.map(([tone, title, desc]) => `
        <div class="alert ${tone}"><strong>${title}</strong><span>${desc}</span></div>
      `).join('');

      const positionData = groupCount(applicants, 'position').sort((a,b) => b.value - a.value);
      const maxPosition = Math.max(1, ...positionData.map(item => item.value));
      document.getElementById('positionData').innerHTML = barListHtml(positionData, maxPosition, true, '');

      const monthlyMap = new Map();
      applicants.forEach(item => {
        if (!item.applied_date) return;
        const key = item.applied_date.slice(0, 7);
        monthlyMap.set(key, (monthlyMap.get(key) || 0) + 1);
      });
      const monthly = [...monthlyMap.entries()].sort((a,b) => a[0].localeCompare(b[0])).slice(-12).map(([month, value]) => ({ month, value }));
      const maxMonthly = Math.max(1, ...monthly.map(item => item.value));
      document.getElementById('monthly').innerHTML = monthly.map(item => `
        <div class="month-col">
          <div class="month-bar" style="height:${(item.value / maxMonthly) * 100}%"></div>
          <div class="month-label">${item.month.slice(5)}월</div>
        </div>
      `).join('');

      const summaryMap = new Map();
      applicants.forEach(item => {
        if (!summaryMap.has(item.position)) {
          summaryMap.set(item.position, {
            position: item.position || '-',
            department: item.department || '-',
            hiring_manager: item.hiring_manager || '-',
            currentStage: item.current_stage || '-',
            applicants: 0,
            interview: 0,
            offer: 0,
            joined: 0,
            leadTimes: []
          });
        }
        const row = summaryMap.get(item.position);
        row.applicants += 1;
        if (['1차면접','2차면접','과제','최종면접'].includes(item.current_stage)) row.interview += 1;
        if (item.final_status === '오퍼' || item.current_stage === '오퍼') row.offer += 1;
        if (item.final_status === '입사완료') row.joined += 1;
        if (Number(item.lead_time_days) > 0) row.leadTimes.push(Number(item.lead_time_days));
        row.currentStage = item.current_stage || row.currentStage;
      });

      document.getElementById('summaryTable').innerHTML = [...summaryMap.values()].map(row => `
        <tr>
          <td>${row.position}</td>
          <td>${row.department}</td>
          <td>${row.hiring_manager}</td>
          <td><span class="status-pill">${row.currentStage}</span></td>
          <td>${row.applicants}</td>
          <td>${row.interview}</td>
          <td>${row.offer}</td>
          <td>${row.joined}</td>
          <td>${average(row.leadTimes)}</td>
        </tr>
      `).join('');

      document.getElementById('csvLinkBox').textContent = `const GOOGLE_SHEET_CSV_URL = '${GOOGLE_SHEET_CSV_URL}';`;
      const latestApplied = applicants.map(item => item.applied_date).filter(Boolean).sort().at(-1) || '';
      document.getElementById('footerNote').textContent = `현재 데이터 기준 최근 지원일: ${formatDate(latestApplied)} · 연결이 안 되면 샘플 데이터가 표시돼.`;
    }

    getApplicants().then(({ data, source }) => render(data, source));
  </script>
</body>
</html>

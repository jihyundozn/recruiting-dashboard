<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>채용 대시보드</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --line: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --brand: #2F5D8A;
      --brand-2: #647f9d;
      --brand-3: #9fb4c8;
      --brand-4: #d5e0ea;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .page { max-width: 1320px; margin: 0 auto; padding: 24px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 1px 3px rgba(15,23,42,.04);
    }
    .header {
      padding: 24px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1.1;
      letter-spacing: -0.03em;
    }
    .filters {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    select {
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      font-size: 14px;
      min-width: 160px;
    }
    .status {
      padding: 10px 14px;
      border-radius: 999px;
      background: #eef4f8;
      color: var(--brand);
      font-size: 13px;
      font-weight: 600;
    }
    .grid-kpi {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .kpi {
      padding: 20px;
      min-height: 120px;
    }
    .kpi .label {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .kpi .value {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .section {
      padding: 22px;
    }
    .section h2 {
      margin: 0 0 18px;
      font-size: 18px;
      letter-spacing: -0.02em;
    }
    .bars { display: grid; gap: 14px; }
    .bar-item .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
      margin-bottom: 6px;
    }
    .track {
      height: 12px;
      background: #eef2f6;
      border-radius: 999px;
      overflow: hidden;
      display: flex;
    }
    .seg1 { background: var(--brand); }
    .seg2 { background: var(--brand-2); }
    .seg3 { background: var(--brand-3); }
    .seg4 { background: var(--brand-4); }
    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 14px;
    }
    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      margin-right: 6px;
      vertical-align: middle;
    }
    .mini-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }
    .mini {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fafcff;
      padding: 16px;
    }
    .mini .label {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .mini .value {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .stack-list {
      display: grid;
      gap: 16px;
    }
    .stack-bar {
      height: 12px;
      background: #eef2f6;
      border-radius: 999px;
      overflow: hidden;
      display: flex;
    }
    .table-wrap {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid #eef2f7;
      text-align: left;
      white-space: nowrap;
    }
    th {
      background: #fafcff;
      color: var(--muted);
      font-weight: 600;
    }
    .empty {
      padding: 24px;
      color: var(--muted);
      font-size: 14px;
    }
    @media (max-width: 1000px) {
      .grid-kpi { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-2 { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .page { padding: 14px; }
      .grid-kpi { grid-template-columns: 1fr; }
      .mini-grid { grid-template-columns: 1fr; }
      h1 { font-size: 26px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card header">
      <h1>채용 대시보드</h1>
      <div class="filters">
        <select id="monthFilter"></select>
        <select id="deptFilter"><option value="전체">전체</option></select>
        <div id="status" class="status">데이터 불러오는 중</div>
      </div>
    </div>

    <div id="kpis" class="grid-kpi"></div>

    <div class="grid-2">
      <div class="card section">
        <h2>유입경로별 성과</h2>
        <div class="legend">
          <span><span class="dot seg1"></span>지원자 수</span>
          <span><span class="dot seg2"></span>입사 완료 수</span>
          <span><span class="dot seg3"></span>미수락 수</span>
        </div>
        <div id="sourceChart" class="bars"></div>
      </div>

      <div class="card section">
        <h2>다이렉트소싱 성과</h2>
        <div id="directKpis" class="mini-grid"></div>
        <div id="directChart" class="bars"></div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card section">
        <h2>월별 채용 결과 추이</h2>
        <div class="legend">
          <span><span class="dot seg1"></span>진행중인 포지션 수</span>
          <span><span class="dot seg2"></span>지원자 수</span>
          <span><span class="dot seg3"></span>불합격 수</span>
          <span><span class="dot seg4"></span>입사 완료 수</span>
        </div>
        <div id="trendChart" class="bars"></div>
      </div>

      <div class="card section">
        <h2>포지션별 단계별 불합격 현황</h2>
        <div id="rejectionChart" class="stack-list"></div>
        <div class="legend" style="margin-top:16px">
          <span><span class="dot" style="background:#dce7f0"></span>지원 접수</span>
          <span><span class="dot" style="background:#bfd0df"></span>1차 인터뷰</span>
          <span><span class="dot" style="background:#9db5ca"></span>2차 인터뷰</span>
          <span><span class="dot" style="background:#7e9ab3"></span>온라인 인성검사</span>
          <span><span class="dot" style="background:#5f7f9f"></span>1/2차 인터뷰(통합)</span>
          <span><span class="dot" style="background:#476988"></span>입사 제안</span>
          <span><span class="dot" style="background:#2F5D8A"></span>입사 대기</span>
        </div>
      </div>
    </div>

    <div class="card section">
      <h2>포지션별 월간 요약</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>포지션</th>
              <th>부서</th>
              <th>지원자 수</th>
              <th>불합격 수</th>
              <th>미수락 수</th>
              <th>입사 제안 수</th>
              <th>입사 완료 수</th>
              <th>다이렉트소싱 후보자 수</th>
              <th>가장 많은 이탈 단계</th>
              <th>hire_goal</th>
              <th>hire_count</th>
              <th>리드타임</th>
            </tr>
          </thead>
          <tbody id="summaryTable"></tbody>
        </table>
      </div>
    </div>
  </div>

<script>
const APPLICANT_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS24f7JxwMT-uE567ecXPhTFpOE-D6dtTZl0BJsZop7M6bJj9eJhcbUrQBDlT0dew/pub?gid=407451000&single=true&output=csv';
const POSITION_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS24f7JxwMT-uE567ecXPhTFpOE-D6dtTZl0BJsZop7M6bJj9eJhcbUrQBDlT0dew/pub?gid=1996116323&single=true&output=csv';

function parseCsv(text) {
  const rows = [];
  let row = [];
  let cur = '';
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    const next = text[i + 1];
    if (ch === '"') {
      if (inQuotes && next === '"') { cur += '"'; i++; }
      else inQuotes = !inQuotes;
    } else if (ch === ',' && !inQuotes) {
      row.push(cur); cur = '';
    } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
      if (ch === '\r' && next === '\n') i++;
      row.push(cur);
      if (row.some(v => v !== '')) rows.push(row);
      row = []; cur = '';
    } else {
      cur += ch;
    }
  }
  if (cur.length || row.length) {
    row.push(cur);
    rows.push(row);
  }
  const headers = (rows[0] || []).map(h => h.trim());
  return rows.slice(1).map(cols => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = (cols[i] || '').trim());
    return obj;
  });
}

function unique(arr) { return [...new Set(arr)]; }
function sum(arr) { return arr.reduce((a, b) => a + b, 0); }
function avg(arr) { return arr.length ? sum(arr) / arr.length : 0; }
function num(v) {
  if (v == null || v === '') return 0;
  const n = Number(String(v).replace(/[^0-9.-]/g, ''));
  return Number.isFinite(n) ? n : 0;
}
function ym(str) {
  return str ? String(str).slice(0, 7) : '';
}
function toDate(str) {
  if (!str) return null;
  const d = new Date(str);
  return isNaN(d.getTime()) ? null : d;
}
function monthStart(month) {
  return new Date(month + '-01');
}
function monthEnd(month) {
  const d = new Date(month + '-01');
  return new Date(d.getFullYear(), d.getMonth() + 1, 0);
}
function fmt(n) {
  return new Intl.NumberFormat('ko-KR').format(Math.round(n || 0));
}
function pct(v) {
  return isFinite(v) ? Math.round(v * 100) + '%' : '-';
}
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
}

const rejectionStageOrder = ['지원 접수','1차 인터뷰','2차 인터뷰','온라인 인성검사','1/2차 인터뷰(통합)','입사 제안','입사 대기'];
const rejectionStageColors = {
  '지원 접수':'#dce7f0',
  '1차 인터뷰':'#bfd0df',
  '2차 인터뷰':'#9db5ca',
  '온라인 인성검사':'#7e9ab3',
  '1/2차 인터뷰(통합)':'#5f7f9f',
  '입사 제안':'#476988',
  '입사 대기':'#2F5D8A'
};

async function load() {
  const status = document.getElementById('status');
  try {
    const [aRes, pRes] = await Promise.all([fetch(APPLICANT_CSV_URL), fetch(POSITION_CSV_URL)]);
    const [aText, pText] = await Promise.all([aRes.text(), pRes.text()]);
    const applicants = parseCsv(aText).filter(r => r.candidate_id || r.position || r.apply_month);
    const positions = parseCsv(pText).filter(r => r.position_id || r.position_name);
    status.textContent = 'Google Sheet 연결됨';
    init(applicants, positions);
  } catch (e) {
    console.error(e);
    status.textContent = '연결 실패';
    document.getElementById('kpis').innerHTML = '<div class="empty">시트 데이터를 불러오지 못했습니다.</div>';
  }
}

function init(applicants, positions) {
  const monthFilter = document.getElementById('monthFilter');
  const deptFilter = document.getElementById('deptFilter');

  const months = unique([
    ...applicants.map(r => r.apply_month).filter(Boolean),
    ...applicants.map(r => ym(r.join_date)).filter(Boolean),
    ...positions.map(r => ym(r.open_date)).filter(Boolean),
    ...positions.map(r => ym(r.close_date)).filter(Boolean)
  ]).sort();

  monthFilter.innerHTML = months.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('');
  if (months.length) monthFilter.value = months[months.length - 1];

  const departments = unique([
    ...applicants.map(r => r.department).filter(Boolean),
    ...positions.map(r => r.department).filter(Boolean)
  ]).sort();
  deptFilter.innerHTML = '<option value="전체">전체</option>' + departments.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('');

  function currentData() {
    const month = monthFilter.value;
    const dept = deptFilter.value;
    const appBase = applicants.filter(r => dept === '전체' || r.department === dept);
    const posBase = positions.filter(r => dept === '전체' || r.department === dept);
    const appMonth = appBase.filter(r => r.apply_month === month);
    const mStart = monthStart(month);
    const mEnd = monthEnd(month);
    const ongoingPositionsInMonth = posBase.filter(r => {
      if (r.position_status !== '진행중') return false;
      const open = toDate(r.open_date);
      const close = toDate(r.close_date);
      if (!open) return false;
      return open <= mEnd && (!close || close >= mStart);
    });
    return { month, appBase, posBase, appMonth, ongoingPositionsInMonth };
  }

  function render() {
    const { month, appBase, posBase, appMonth, ongoingPositionsInMonth } = currentData();

    // KPIs
    const ongoingPositionCount = posBase.filter(r => r.position_status === '진행중').length;
    const monthlyHireGoal = sum(ongoingPositionsInMonth.map(r => num(r.hire_goal)));
    const monthlyHireCount = appBase.filter(r => ym(r.join_date) === month).length;
    const monthlyApplicants = appMonth.length;
    const monthlyDirectAccepted = appMonth.filter(r => r.is_direct_sourcing === 'Y' && r.final_result !== '미수락').length;
    const averageLeadTime = avg(posBase.map(r => num(r.lead_time_days)).filter(v => v > 0));

    const kpis = [
      ['진행중인 포지션 수', fmt(ongoingPositionCount)],
      ['당월 채용 중인 인원 수', fmt(monthlyHireGoal)],
      ['당월 채용 완료 인원 수', fmt(monthlyHireCount)],
      ['당월 지원자 수', fmt(monthlyApplicants)],
      ['당월 다이렉트소싱 후보자 수', fmt(monthlyDirectAccepted)],
      ['평균 리드타임', averageLeadTime ? fmt(averageLeadTime) + '일' : '-']
    ];
    document.getElementById('kpis').innerHTML = kpis.map(([label, value]) => `
      <div class="card kpi">
        <div class="label">${escapeHtml(label)}</div>
        <div class="value">${escapeHtml(value)}</div>
      </div>
    `).join('');

    // Chart 1: source performance
    const sources = unique(appMonth.map(r => r.source_detail).filter(Boolean));
    const sourceStats = sources.map(source => {
      const rows = appMonth.filter(r => r.source_detail === source);
      return {
        source,
        applicants: rows.length,
        joined: rows.filter(r => r.final_result === '입사 완료').length,
        declined: rows.filter(r => r.final_result === '미수락').length
      };
    }).sort((a, b) => b.applicants - a.applicants);

    const sourceMax = Math.max(1, ...sourceStats.map(x => Math.max(x.applicants, x.joined, x.declined)));
    document.getElementById('sourceChart').innerHTML = sourceStats.length ? sourceStats.map(item => `
      <div class="bar-item">
        <div class="row"><span>${escapeHtml(item.source)}</span><span>지원 ${fmt(item.applicants)} / 입사 ${fmt(item.joined)} / 미수락 ${fmt(item.declined)}</span></div>
        <div class="track">
          <div class="seg1" style="width:${item.applicants / sourceMax * 100}%"></div>
          <div class="seg2" style="width:${item.joined / sourceMax * 100}%"></div>
          <div class="seg3" style="width:${item.declined / sourceMax * 100}%"></div>
        </div>
      </div>
    `).join('') : '<div class="empty">해당 월 데이터가 없습니다.</div>';

    // Chart 2: monthly trend
    const trendMonths = unique([
      ...applicants.map(r => r.apply_month).filter(Boolean),
      ...applicants.map(r => ym(r.join_date)).filter(Boolean),
      ...positions.map(r => ym(r.open_date)).filter(Boolean),
      ...positions.map(r => ym(r.close_date)).filter(Boolean)
    ]).sort();

    const trendStats = trendMonths.map(m => {
      const start = monthStart(m);
      const end = monthEnd(m);
      const ongoing = posBase.filter(r => {
        const open = toDate(r.open_date);
        const close = toDate(r.close_date);
        if (!open) return false;
        return r.position_status === '진행중' && open <= end && (!close || close >= start);
      }).length;
      const applicantsCount = appBase.filter(r => r.apply_month === m).length;
      const rejectedCount = appBase.filter(r => r.final_result === '불합격' && ym(r.rejection_date || r.applied_date) === m).length;
      const joinedCount = appBase.filter(r => r.final_result === '입사 완료' && ym(r.join_date) === m).length;
      return { month: m, ongoing, applicants: applicantsCount, rejected: rejectedCount, joined: joinedCount };
    });
    const trendMax = Math.max(1, ...trendStats.map(x => Math.max(x.ongoing, x.applicants, x.rejected, x.joined)));
    document.getElementById('trendChart').innerHTML = trendStats.length ? trendStats.map(item => `
      <div class="bar-item">
        <div class="row"><span>${escapeHtml(item.month)}</span><span>포지션 ${fmt(item.ongoing)} / 지원 ${fmt(item.applicants)} / 불합격 ${fmt(item.rejected)} / 입사 ${fmt(item.joined)}</span></div>
        <div class="track">
          <div class="seg1" style="width:${item.ongoing / trendMax * 100}%"></div>
          <div class="seg2" style="width:${item.applicants / trendMax * 100}%"></div>
          <div class="seg3" style="width:${item.rejected / trendMax * 100}%"></div>
          <div class="seg4" style="width:${item.joined / trendMax * 100}%"></div>
        </div>
      </div>
    `).join('') : '<div class="empty">표시할 월별 데이터가 없습니다.</div>';

    // Chart 3: rejection by position
    const rejectionRows = appMonth.filter(r => ['불합격', '미수락'].includes(r.final_result) && r.position);
    const rejectionPositions = unique(rejectionRows.map(r => r.position));
    const rejectionStats = rejectionPositions.map(position => {
      const rows = rejectionRows.filter(r => r.position === position);
      const counts = Object.fromEntries(rejectionStageOrder.map(stage => [stage, rows.filter(r => r.rejection_stage === stage).length]));
      const total = sum(Object.values(counts));
      return { position, counts, total };
    }).sort((a, b) => b.total - a.total);

    document.getElementById('rejectionChart').innerHTML = rejectionStats.length ? rejectionStats.map(item => {
      const segs = rejectionStageOrder.map(stage => {
        const value = item.counts[stage];
        const width = item.total ? (value / item.total) * 100 : 0;
        return `<div style="width:${width}%; background:${rejectionStageColors[stage]}"></div>`;
      }).join('');
      return `
        <div>
          <div class="row" style="margin-bottom:6px"><span>${escapeHtml(item.position)}</span><span>${fmt(item.total)}건</span></div>
          <div class="stack-bar">${segs}</div>
        </div>
      `;
    }).join('') : '<div class="empty">해당 월 불합격 데이터가 없습니다.</div>';

    // Chart 4: direct sourcing
    const directRows = appMonth.filter(r => r.is_direct_sourcing === 'Y');
    const directTotal = directRows.length;
    const directDeclined = directRows.filter(r => r.final_result === '미수락').length;
    const directAccepted = directRows.filter(r => r.final_result !== '미수락').length;
    const directRate = directTotal ? directAccepted / directTotal : 0;

    document.getElementById('directKpis').innerHTML = [
      ['다이렉트소싱 후보자 수', fmt(directTotal)],
      ['미수락 수', fmt(directDeclined)],
      ['수락률', pct(directRate)]
    ].map(([label, value]) => `
      <div class="mini">
        <div class="label">${escapeHtml(label)}</div>
        <div class="value">${escapeHtml(value)}</div>
      </div>
    `).join('');

    const directBySource = unique(directRows.map(r => r.source_detail).filter(Boolean)).map(source => {
      const rows = directRows.filter(r => r.source_detail === source);
      return {
        source,
        total: rows.length,
        declined: rows.filter(r => r.final_result === '미수락').length,
        accepted: rows.filter(r => r.final_result !== '미수락').length
      };
    }).sort((a, b) => b.total - a.total);
    const directMax = Math.max(1, ...directBySource.map(x => Math.max(x.total, x.declined, x.accepted)));
    document.getElementById('directChart').innerHTML = directBySource.length ? directBySource.map(item => `
      <div class="bar-item">
        <div class="row"><span>${escapeHtml(item.source)}</span><span>후보자 ${fmt(item.total)} / 미수락 ${fmt(item.declined)} / 수락 ${fmt(item.accepted)}</span></div>
        <div class="track">
          <div class="seg1" style="width:${item.total / directMax * 100}%"></div>
          <div class="seg3" style="width:${item.declined / directMax * 100}%"></div>
          <div class="seg2" style="width:${item.accepted / directMax * 100}%"></div>
        </div>
      </div>
    `).join('') : '<div class="empty">해당 월 다이렉트소싱 데이터가 없습니다.</div>';

    // Table
    const positionsInMonth = unique(appMonth.map(r => r.position).filter(Boolean));
    const tableRows = positionsInMonth.map(position => {
      const rows = appMonth.filter(r => r.position === position);
      const posMeta = posBase.find(p => p.position_name === position) || {};
      const stageCounts = rejectionStageOrder.map(stage => ({
        stage,
        value: rows.filter(r => r.rejection_stage === stage).length
      })).sort((a, b) => b.value - a.value);
      return {
        position,
        department: rows[0]?.department || posMeta.department || '-',
        applicants: rows.length,
        rejected: rows.filter(r => r.final_result === '불합격').length,
        declined: rows.filter(r => r.final_result === '미수락').length,
        offered: rows.filter(r => r.final_result === '입사 제안').length,
        joined: rows.filter(r => r.final_result === '입사 완료').length,
        directAccepted: rows.filter(r => r.is_direct_sourcing === 'Y' && r.final_result !== '미수락').length,
        topStage: stageCounts[0]?.value ? stageCounts[0].stage : '-',
        hireGoal: num(posMeta.hire_goal),
        hireCount: num(posMeta.hire_count),
        leadTime: num(posMeta.lead_time_days)
      };
    }).sort((a, b) => b.applicants - a.applicants);

    document.getElementById('summaryTable').innerHTML = tableRows.length ? tableRows.map(r => `
      <tr>
        <td>${escapeHtml(r.position)}</td>
        <td>${escapeHtml(r.department)}</td>
        <td>${fmt(r.applicants)}</td>
        <td>${fmt(r.rejected)}</td>
        <td>${fmt(r.declined)}</td>
        <td>${fmt(r.offered)}</td>
        <td>${fmt(r.joined)}</td>
        <td>${fmt(r.directAccepted)}</td>
        <td>${escapeHtml(r.topStage)}</td>
        <td>${fmt(r.hireGoal)}</td>
        <td>${fmt(r.hireCount)}</td>
        <td>${r.leadTime ? fmt(r.leadTime) + '일' : '-'}</td>
      </tr>
    `).join('') : '<tr><td colspan="12" class="empty">해당 월 포지션 데이터가 없습니다.</td></tr>';
  }

  monthFilter.addEventListener('change', render);
  deptFilter.addEventListener('change', render);
  render();
}

load();
</script>
</body>
</html>
